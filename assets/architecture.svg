<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">SmokeLab high-level system architecture</title><desc id="desc">Editable scene state feeds live GPU simulation, lighting and volume integration, then a native viewer and Unity algorithm adapter; instrumentation records costs and checks.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#65d6cf"/></marker></defs><rect width="1200" height="420" rx="20" fill="#0f1a22"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="48" fill="#7ddcd1" font-size="15" letter-spacing="3">SYSTEM OVERVIEW / PRESENTATION ONLY</text><g fill="#152630" stroke="#34505a"><rect x="40" y="95" width="245" height="120" rx="12"/><rect x="330" y="95" width="245" height="120" rx="12"/><rect x="620" y="95" width="245" height="120" rx="12"/><rect x="910" y="95" width="250" height="120" rx="12"/><rect x="330" y="280" width="830" height="95" rx="12"/></g><g fill="#f1f5f5" font-size="22"><text x="62" y="137">Scene &amp; controls</text><text x="352" y="137">Live GPU state</text><text x="642" y="137">Volume rendering</text><text x="932" y="137">Presentation</text><text x="355" y="317">Instrumentation &amp; validation</text></g><g fill="#a4b7bd" font-size="16"><text x="62" y="173">Sources · lights · camera</text><text x="352" y="173">Density · motion · lighting</text><text x="642" y="173">Integration · composition</text><text x="932" y="173">D3D11 viewer / Unity</text><text x="355" y="348">GPU stage timings · controller checks · numerical audits · repeatable captures</text><text x="40" y="319">Core implementation</text><text x="40" y="345">remains private.</text></g><g fill="none" stroke="#65d6cf" stroke-width="2" marker-end="url(#arrow)"><path d="M285 155H320"/><path d="M575 155H610"/><path d="M865 155H900"/><path d="M452 215V268"/><path d="M742 215V268"/><path d="M1035 215V268"/></g></g></svg>
